version: '3.8'

services:
  # MySQL Database Container
  mysql:
    image: mysql:8.0
    container_name: worker_allocation_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: worker_allocation_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - app-network

  # Redis Cache Container
  redis:
    image: redis:alpine
    container_name: worker_allocation_redis
    ports:
      - "6379:6379"
    networks:
      - app-network

  # Node.js Express Backend & Socket.io Server Container
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: worker_allocation_backend
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: worker_allocation_db
      JWT_SECRET: super_secret_worker_allocation_key_2026
      REDIS_URL: redis://redis:6379
    ports:
      - "5010:5000"
    depends_on:
      - mysql
      - redis
    networks:
      - app-network

  # React Frontend Container
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: worker_allocation_frontend
    ports:
      - "3000:5173"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
